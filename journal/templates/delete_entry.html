{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/delete.css' %}">
{% endblock %}


{% block content %}

<div class="delete-card">

    <div class="delete-icon">
        🗑️
    </div>

    <h2>Delete Memory</h2>

    <p class="delete-text">
        Are you sure you want to permanently delete this journal entry?
    </p>

    <div class="delete-preview">

        <strong>📖 {{ entry.title }}</strong>

    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="delete-buttons">

            <a href="{% url 'entry_list' %}" class="cancel-btn">
                Keep It
            </a>

            <button type="submit" class="delete-btn">
                Delete Forever
            </button>

        </div>

    </form>

</div>

{% endblock %}
