<h1>Edit Entry</h1>

<form method="POST">
    {% csrf_token %}

    <label>Title</label>
    <input
        type="text"
        name="title"
        value="{{ entry.title }}"
    >

    <br><br>

    <label>Content</label>

    <textarea name="content">
{{ entry.content }}
    </textarea>

    <br><br>

    <button type="submit">
        Update Entry
    </button>

</form>
