{% extends 'base.html' %}

{% block content %}

<div class="entry-card">

```
<h2>✏️ Edit Entry</h2>

<form method="POST">
    {% csrf_token %}

    <p>
        <label>Title</label>
        <input type="text" name="title" value="{{ entry.title }}">
    </p>

    <p>
        <label>Journal Entry</label>
        <textarea name="content">{{ entry.content }}</textarea>
    </p>

    <p>
        <label>🌸 Gratitude</label>
        <textarea name="gratitude">{{ entry.gratitude }}</textarea>
    </p>

    <p>
        <label>🎯 Tomorrow's Goal</label>
        <textarea name="tomorrow_goal">{{ entry.tomorrow_goal }}</textarea>
    </p>

    <p>
        <label>📝 Notes</label>
        <textarea name="notes">{{ entry.notes }}</textarea>
    </p>

    <button type="submit">
        Update Entry
    </button>

</form>
```

</div>

{% endblock %}
