{% extends 'base.html' %}

{% block content %}

<h2>Edit Entry</h2>

<form method="POST">
    {% csrf_token %}

    <label>Title</label>
    <input type="text" name="title" value="{{ entry.title }}">

    <br><br>

    <label>Content</label>

    <textarea name="content">{{ entry.content }}</textarea>

    <br><br>

    <button type="submit">
        Update Entry
    </button>

</form>

{% endblock %}
