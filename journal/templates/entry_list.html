{% extends 'base.html' %}

{% block content %}

<div class="header-section">
    <h2>My Journal Entries</h2>

    <a href="{% url 'create_entry' %}" class="btn">
        + New Entry
    </a>
</div>

{% for entry in entries %}

<div class="entry-card">

    <h3>{{ entry.title }}</h3>

    <p>{{ entry.content|truncatewords:25 }}</p>

    <small class="entry-date">
    {{ entry.created_at|date:"M d, Y" }}
    </small>

    <div class="actions">
        <a href="{% url 'edit_entry' entry.id %}" class="btn-small">
            Edit
        </a>

        <a href="{% url 'delete_entry' entry.id %}" class="btn-small danger">
            Delete
        </a>
    </div>

</div>

{% empty %}

<p>No journal entries yet.</p>

{% endfor %}

{% endblock %}
