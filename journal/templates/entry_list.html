{% extends 'base.html' %}

{% block content %}

<h2>My Entries</h2>

<a href="{% url 'create_entry' %}">
    Create New Entry
</a>

<hr>

{% for entry in entries %}

<h3>{{ entry.title }}</h3>

<p>{{ entry.content }}</p>

<a href="{% url 'edit_entry' entry.id %}">
    Edit
</a>

<a href="{% url 'delete_entry' entry.id %}">
    Delete
</a>

<hr>

{% endfor %}

{% endblock %}
