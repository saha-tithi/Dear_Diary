{% extends 'base.html' %}

{% block content %}

<div class="entry-card journal-page">

    <div class="page-header">

        <span class="page-icon">📖</span>

        <h2>New Day</h2>

        <p class="page-subtitle">
            Every page holds a memory worth keeping.
        </p>

    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="journal-block">

            <label>📝 Title</label>

            {{ form.title }}

        </div>

        <div class="journal-block">

            <label>📖 Today's Story</label>

            {{ form.content }}

        </div>

        <div class="journal-block">

            <label>🌸 Gratitude</label>

            {{ form.gratitude }}

        </div>

        <div class="journal-block">

            <label>🎯 Tomorrow's Goal</label>

            {{ form.tomorrow_goal }}

        </div>

        <div class="journal-block">

            <label>🌿 Notes</label>

            {{ form.notes }}

        </div>

        <button class="save-btn" type="submit">

            Save Entry

        </button>

    </form>

</div>

{% endblock %}
