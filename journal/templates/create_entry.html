{% extends 'base.html' %}

{% block content %}

<div class="entry-card">

```
<h2>📖 New Day</h2>

<form method="POST">
    {% csrf_token %}

    <p>
        <label>Title</label>
        {{ form.title }}
    </p>

    <p>
        <label>Journal Entry</label>
        {{ form.content }}
    </p>

    <p>
        <label>🌸 Gratitude</label>
        {{ form.gratitude }}
    </p>

    <p>
        <label>🎯 Tomorrow's Goal</label>
        {{ form.tomorrow_goal }}
    </p>

    <p>
        <label>📝 Notes</label>
        {{ form.notes }}
    </p>

    <button type="submit">
        Save Entry
    </button>

</form>
```

</div>

{% endblock %}
