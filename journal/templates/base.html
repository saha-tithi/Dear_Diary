{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Dear Diary</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container">

    <header>
        <h1>📖 Dear Diary</h1>

        {% if user.is_authenticated %}
            <div class="user-info">
                Welcome, {{ user.username }}

                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            </div>
        {% endif %}
    </header>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
